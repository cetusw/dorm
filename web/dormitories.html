<div class="flex justify-between items-end mb-8">
    <div>
        <nav class="mb-3 text-sm font-medium text-slate-500">
            <span class="text-slate-900">Общежития</span>
        </nav>
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Общежития</h1>
    </div>

    <button
            hx-get="/admin/dormitories/create"
            hx-target="body"
            hx-swap="beforeend"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition-all shadow-lg shadow-blue-200 flex items-center gap-2 group">
        <i data-lucide="plus" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
        Создать общежитие
    </button>
</div>

<div class="mb-5 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <label for="structure-search" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-500">Поиск</label>
    <div class="relative">
        <i data-lucide="search" class="absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
        <input id="structure-search" type="search" data-structure-search placeholder="Название, адрес или лидер"
               class="w-full rounded-xl border border-slate-200 bg-slate-50 py-3 pl-11 pr-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">
    </div>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden" data-structure-table>
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
            <tr class="bg-slate-50/50 border-b border-slate-200">
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Название</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Адрес</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Лидер</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Группы</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-right">Действия</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            {{ range .Dormitories }}
            <tr id="dormitory-{{ .ID }}" class="hover:bg-blue-50/30 transition-colors group" data-structure-row data-search="{{ .Name }} {{ .Address }} {{ .LeaderName }}">
                <td class="px-6 py-5">
                    <a href="/admin/dormitories/{{ .ID }}/groups" class="font-bold text-slate-900 group-hover:text-blue-700 transition-colors">{{ .Name }}</a>
                </td>
                <td class="px-6 py-5 text-sm text-slate-700">{{ .Address }}</td>
                <td class="px-6 py-5 text-sm text-slate-700">{{ .LeaderName }}</td>
                <td class="px-6 py-5 text-sm text-slate-700">{{ .GroupsCount }}</td>
                <td class="px-6 py-5 text-right">
                    <div class="flex justify-end gap-1">
                        <a href="/admin/dormitories/{{ .ID }}/groups" class="p-2.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all" title="Группы">
                            <i data-lucide="folder-tree" class="w-4 h-4"></i>
                        </a>
                        <button class="p-2.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all" title="Редактировать"
                                hx-get="/admin/dormitories/{{ .ID }}/edit" hx-target="body" hx-swap="beforeend">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button class="p-2.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all" title="Удалить"
                                hx-delete="/admin/dormitories/{{ .ID }}" hx-confirm="Удалить общежитие {{ .Name }}?" hx-swap="none">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </td>
            </tr>
            {{ else }}
            <tr>
                <td colspan="5" class="px-6 py-12 text-center text-slate-500">
                    <div class="flex flex-col items-center">
                        <i data-lucide="building-2" class="w-12 h-12 text-slate-200 mb-3"></i>
                        <p>Общежития не найдены</p>
                    </div>
                </td>
            </tr>
            {{ end }}
            <tr class="hidden" data-filter-empty>
                <td colspan="5" class="px-6 py-12 text-center text-slate-500">
                    <div class="flex flex-col items-center">
                        <i data-lucide="search-x" class="w-12 h-12 text-slate-200 mb-3"></i>
                        <p>Ничего не найдено</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>lucide.createIcons();</script>
