<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dorm Admin | Панель управления</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .admin-select {
            width: 100%;
            min-height: 42px;
            appearance: none;
            -webkit-appearance: none;
            border: 1px solid rgb(203 213 225);
            border-radius: 0.75rem;
            background-color: #fff;
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M5 7.5L10 12.5L15 7.5' stroke='%2364758B' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-position: right 0.85rem center;
            background-repeat: no-repeat;
            background-size: 1.1rem;
            color: rgb(15 23 42);
            font-size: 0.875rem;
            line-height: 1.25rem;
            padding: 0.625rem 2.75rem 0.625rem 1rem;
            transition: border-color 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
        }

        .admin-select:hover {
            border-color: rgb(148 163 184);
        }

        .admin-select:focus {
            border-color: rgb(37 99 235);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.14);
            outline: none;
        }

        .admin-select:disabled,
        .admin-select-disabled {
            background-color: rgb(248 250 252);
            color: rgb(148 163 184);
            cursor: not-allowed;
        }

        .admin-select-source {
            height: 1px !important;
            opacity: 0 !important;
            pointer-events: none !important;
            position: absolute !important;
            width: 1px !important;
        }

        .admin-select-shell {
            position: relative;
            width: 100%;
        }

        .admin-select-trigger {
            align-items: center;
            background: #fff;
            border: 1px solid rgb(203 213 225);
            border-radius: 0.75rem;
            color: rgb(15 23 42);
            display: flex;
            font-size: 0.875rem;
            justify-content: space-between;
            line-height: 1.25rem;
            min-height: 42px;
            padding: 0.625rem 0.85rem 0.625rem 1rem;
            text-align: left;
            transition: border-color 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
            width: 100%;
        }

        .admin-select-trigger:hover {
            border-color: rgb(148 163 184);
        }

        .admin-select-trigger:focus {
            border-color: rgb(37 99 235);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.14);
            outline: none;
        }

        .admin-select-trigger[aria-disabled="true"] {
            background-color: rgb(248 250 252);
            color: rgb(148 163 184);
            cursor: not-allowed;
        }

        .admin-select-trigger-icon {
            color: rgb(100 116 139);
            flex: 0 0 auto;
            height: 1rem;
            margin-left: 0.75rem;
            transition: transform 150ms ease;
            width: 1rem;
        }

        .admin-select-shell[data-open="true"] .admin-select-trigger-icon {
            transform: rotate(180deg);
        }

        .admin-select-menu {
            background: #fff;
            border: 1px solid rgb(226 232 240);
            border-radius: 0.85rem;
            box-shadow: 0 18px 45px rgb(15 23 42 / 0.16);
            display: none;
            left: 0;
            margin-top: 0.35rem;
            max-height: 14rem;
            padding: 0.25rem;
            position: absolute;
            right: 0;
            top: 100%;
            z-index: 80;
        }

        .admin-select-shell[data-open="true"] .admin-select-menu {
            display: block;
        }

        .admin-select-search {
            border: 1px solid rgb(226 232 240);
            border-radius: 0.65rem;
            color: rgb(15 23 42);
            font-size: 0.875rem;
            line-height: 1.25rem;
            margin-bottom: 0.25rem;
            outline: none;
            padding: 0.5rem 0.65rem;
            width: 100%;
        }

        .admin-select-search:focus {
            border-color: rgb(37 99 235);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.12);
        }

        .admin-select-options {
            max-height: 10.5rem;
            overflow-y: auto;
        }

        .admin-select-option {
            align-items: center;
            border-radius: 0.65rem;
            color: rgb(51 65 85);
            display: flex;
            font-size: 0.875rem;
            justify-content: space-between;
            line-height: 1.25rem;
            padding: 0.625rem 0.75rem;
            text-align: left;
            transition: background-color 120ms ease, color 120ms ease;
            width: 100%;
        }

        .admin-select-option:hover,
        .admin-select-option:focus {
            background: rgb(239 246 255);
            color: rgb(29 78 216);
            outline: none;
        }

        .admin-select-option[aria-selected="true"] {
            background: rgb(219 234 254);
            color: rgb(29 78 216);
            font-weight: 700;
        }

        .admin-select-empty {
            color: rgb(100 116 139);
            display: none;
            font-size: 0.875rem;
            padding: 0.75rem;
            text-align: center;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
<div class="flex h-screen overflow-hidden">
    <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0 shadow-xl">
        <div class="p-6 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <i data-lucide="building-2" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-lg tracking-tight">Dorm Admin</span>
            </div>
        </div>

        <nav class="flex-1 p-4 space-y-2 mt-4">
            <a href="/admin/users"
               class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-800 group {{ if eq .ActiveSection "users" }}bg-slate-800 text-white{{ end }}">
                <i data-lucide="users" class="w-5 h-5 {{ if eq .ActiveSection "users" }}text-blue-400{{ else }}text-slate-400{{ end }} group-hover:text-blue-400"></i>
                <span class="font-medium">Жители</span>
            </a>

            <a href="/admin/dormitories"
               class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-800 group {{ if eq .ActiveSection "dormitories" }}bg-slate-800 text-white{{ end }}">
                <i data-lucide="building-2" class="w-5 h-5 {{ if eq .ActiveSection "dormitories" }}text-blue-400{{ else }}text-slate-400{{ end }} group-hover:text-blue-400"></i>
                <span class="font-medium">Общежития</span>
            </a>

            <a href="/admin/tasks"
               class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-800 group {{ if eq .ActiveSection "tasks" }}bg-slate-800 text-white{{ end }}">
                <i data-lucide="check-square" class="w-5 h-5 {{ if eq .ActiveSection "tasks" }}text-blue-400{{ else }}text-slate-400{{ end }} group-hover:text-blue-400"></i>
                <span class="font-medium">Задачи</span>
            </a>

            <div class="pt-4 pb-2 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                Система
            </div>

            <a href="/admin/settings"
               class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-800 group">
                <i data-lucide="settings" class="w-5 h-5 text-slate-400 group-hover:text-blue-400"></i>
                <span class="font-medium">Настройки</span>
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800">
            <div class="flex items-center gap-3 px-4 py-2">
                <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-xs font-bold">
                    AD
                </div>
                <div class="overflow-hidden">
                    <p class="text-sm font-medium truncate">Admin User</p>
                    <p class="text-xs text-slate-500 truncate">admin@dorm.local</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-gray-50">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shrink-0">
            <h2 class="text-sm font-medium text-gray-500">Система управления общежитием v1.0</h2>
            <div class="flex items-center gap-4">
                <button class="p-2 text-gray-400 hover:text-gray-600"><i data-lucide="bell" class="w-5 h-5"></i></button>
                <button class="p-2 text-gray-400 hover:text-gray-600"><i data-lucide="log-out" class="w-5 h-5"></i></button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="max-w-6xl mx-auto">
                {{embed}}
            </div>
        </div>
    </main>

</div>

<script>
    function closeAdminSelects(exceptShell) {
        document.querySelectorAll('.admin-select-shell[data-open="true"]').forEach((shell) => {
            if (shell !== exceptShell) {
                shell.dataset.open = 'false';
            }
        });
    }

    function syncAdminSelect(select) {
        const shell = select.nextElementSibling;
        if (!shell || !shell.classList.contains('admin-select-shell')) return;

        const trigger = shell.querySelector('[data-admin-select-trigger]');
        const label = shell.querySelector('[data-admin-select-label]');
        const menu = shell.querySelector('[data-admin-select-menu]');
        const searchInput = shell.querySelector('[data-admin-select-search]');
        const optionsContainer = shell.querySelector('[data-admin-select-options]');
        const emptyState = shell.querySelector('[data-admin-select-empty]');
        const selectedOption = select.selectedOptions[0] || select.options[0];

        label.textContent = selectedOption ? selectedOption.textContent : '';
        trigger.setAttribute('aria-disabled', select.disabled ? 'true' : 'false');
        trigger.disabled = select.disabled;
        shell.classList.toggle('admin-select-disabled', select.disabled);
        shell.dataset.open = select.disabled ? 'false' : shell.dataset.open;

        optionsContainer.innerHTML = '';
        Array.from(select.options).forEach((option) => {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'admin-select-option';
            item.textContent = option.textContent;
            item.dataset.value = option.value;
            item.dataset.search = option.textContent;
            item.setAttribute('role', 'option');
            item.setAttribute('aria-selected', option.selected ? 'true' : 'false');
            item.addEventListener('click', () => {
                select.value = option.value;
                select.dispatchEvent(new Event('change', {bubbles: true}));
                closeAdminSelects();
                syncAdminSelect(select);
            });
            optionsContainer.appendChild(item);
        });
        if (searchInput) {
            searchInput.value = '';
        }
        if (emptyState) {
            emptyState.style.display = 'none';
        }
        menu.dataset.optionsCount = String(select.options.length);
    }

    function enhanceAdminSelects(root = document) {
        root.querySelectorAll('select.admin-select').forEach((select) => {
            if (select.dataset.customSelectReady === 'true') {
                syncAdminSelect(select);
                return;
            }

            select.dataset.customSelectReady = 'true';
            select.classList.add('admin-select-source');

            const shell = document.createElement('div');
            shell.className = 'admin-select-shell';
            shell.dataset.open = 'false';

            const trigger = document.createElement('button');
            trigger.type = 'button';
            trigger.className = 'admin-select-trigger';
            trigger.dataset.adminSelectTrigger = 'true';
            trigger.setAttribute('aria-haspopup', 'listbox');
            trigger.innerHTML = '<span data-admin-select-label></span><i data-lucide="chevron-down" class="admin-select-trigger-icon"></i>';

            const menu = document.createElement('div');
            menu.className = 'admin-select-menu';
            menu.dataset.adminSelectMenu = 'true';
            menu.setAttribute('role', 'listbox');

            trigger.addEventListener('click', () => {
                if (select.disabled) return;
                const shouldOpen = shell.dataset.open !== 'true';
                closeAdminSelects(shell);
                shell.dataset.open = shouldOpen ? 'true' : 'false';
                if (shouldOpen) {
                    const searchInput = shell.querySelector('[data-admin-select-search]');
                    if (searchInput) {
                        searchInput.focus();
                    }
                }
            });

            select.addEventListener('change', () => syncAdminSelect(select));

            const searchInput = document.createElement('input');
            searchInput.type = 'search';
            searchInput.className = 'admin-select-search';
            searchInput.placeholder = 'Поиск';
            searchInput.dataset.adminSelectSearch = 'true';
            searchInput.setAttribute('aria-label', 'Поиск по списку');
            searchInput.addEventListener('click', (event) => event.stopPropagation());
            searchInput.addEventListener('input', () => filterAdminSelect(shell, searchInput.value));

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'admin-select-options';
            optionsContainer.dataset.adminSelectOptions = 'true';

            const emptyState = document.createElement('div');
            emptyState.className = 'admin-select-empty';
            emptyState.dataset.adminSelectEmpty = 'true';
            emptyState.textContent = 'Ничего не найдено';

            menu.appendChild(searchInput);
            menu.appendChild(optionsContainer);
            menu.appendChild(emptyState);

            shell.appendChild(trigger);
            shell.appendChild(menu);
            select.insertAdjacentElement('afterend', shell);
            syncAdminSelect(select);
        });
    }

    function filterAdminSelect(shell, query) {
        const options = Array.from(shell.querySelectorAll('.admin-select-option'));
        const emptyState = shell.querySelector('[data-admin-select-empty]');
        const normalizedQuery = normalizeSearchValue(query);
        let visibleCount = 0;

        options.forEach((option) => {
            const isVisible = normalizedQuery === '' || normalizeSearchValue(option.dataset.search).includes(normalizedQuery);
            option.classList.toggle('hidden', !isVisible);
            if (isVisible) visibleCount++;
        });

        if (emptyState) {
            emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
        }
    }

    function normalizeSearchValue(value) {
        return (value || '').toString().trim().toLowerCase();
    }

    function setupUserSearch() {
        const table = document.querySelector('[data-user-table], [data-structure-table]');
        if (!table) return;
        if (table.dataset.searchReady === 'true') return;
        table.dataset.searchReady = 'true';

        const searchInput = document.querySelector('[data-user-search], [data-structure-search]');
        const rows = Array.from(table.querySelectorAll('[data-user-row], [data-structure-row]'));
        const emptyState = table.querySelector('[data-filter-empty]');

        const applySearch = () => {
            const query = normalizeSearchValue(searchInput ? searchInput.value : '');

            let visibleCount = 0;
            rows.forEach((row) => {
                const isVisible = query === '' || normalizeSearchValue(row.dataset.search).includes(query);
                row.classList.toggle('hidden', !isVisible);
                if (isVisible) visibleCount++;
            });

            if (emptyState) {
                emptyState.classList.toggle('hidden', visibleCount !== 0 || rows.length === 0);
            }
        };

        if (searchInput) {
            searchInput.addEventListener('input', applySearch);
        }
        applySearch();
    }

    function setupMemberSearch(root = document) {
        root.querySelectorAll('[data-member-search]').forEach((searchInput) => {
            if (searchInput.dataset.searchReady === 'true') return;
            searchInput.dataset.searchReady = 'true';

            const scope = searchInput.closest('[data-member-search-scope]');
            if (!scope) return;

            const rows = Array.from(scope.querySelectorAll('[data-member-row]'));
            const emptyState = scope.querySelector('[data-member-search-empty]');

            const applySearch = () => {
                const query = normalizeSearchValue(searchInput.value);
                let visibleCount = 0;

                rows.forEach((row) => {
                    const isVisible = query === '' || normalizeSearchValue(row.dataset.memberSearch).includes(query);
                    row.classList.toggle('hidden', !isVisible);
                    if (isVisible) visibleCount++;
                });

                if (emptyState) {
                    emptyState.classList.toggle('hidden', visibleCount !== 0 || rows.length === 0);
                }
            };

            searchInput.addEventListener('input', applySearch);
            applySearch();
        });
    }

    document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;

        if (document.querySelector('.admin-select-shell[data-open="true"]')) {
            closeAdminSelects();
            return;
        }

        const modal = document.getElementById('modal');
        if (modal) {
            modal.remove();
        }
    });

    document.addEventListener('click', (event) => {
        if (!event.target.closest('.admin-select-shell')) {
            closeAdminSelects();
        }
    });

    document.addEventListener('submit', (event) => {
        const form = event.target.closest('[data-team-form]');
        if (!form) return;

        const selectedTransferMember = form.querySelector('[data-transfer-member="true"]:checked');
        if (selectedTransferMember && !confirm('Один или несколько жителей уже находятся в другой команде. Переместить выбранных жителей?')) {
            event.preventDefault();
        }
    }, true);

    enhanceAdminSelects();
    lucide.createIcons();
    setupUserSearch();
    setupMemberSearch();
    document.body.addEventListener('htmx:afterSettle', () => {
        enhanceAdminSelects();
        setupUserSearch();
        setupMemberSearch();
        lucide.createIcons();
    });
</script>
</body>
</html>
