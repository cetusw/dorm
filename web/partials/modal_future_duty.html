<div id="modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4" data-modal-backdrop>
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[92vh] flex flex-col overflow-hidden border border-slate-200">
        <div class="flex justify-between items-start p-6 border-b border-slate-100">
            <div>
                <h3 class="text-xl font-bold text-slate-900">Настройки дежурства группы</h3>
                <p class="mt-1 text-sm text-slate-500">{{ .Group.Name }}</p>
            </div>
            <button type="button" class="text-slate-400 hover:text-slate-600 rounded-lg p-1" onclick="this.closest('[data-modal-backdrop]').remove()">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <form hx-put="/admin/dormitories/{{ .Dormitory.ID }}/groups/{{ .Group.ID }}/duties/future" hx-swap="none" class="flex min-h-0 flex-1 flex-col">
            <div class="min-h-0 flex-1 space-y-4 overflow-y-auto p-6">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 uppercase">Следующая дежурная команда</label>
                    <select name="next_duty_team" class="admin-select">
                        <option value="">Следующая по порядку</option>
                        {{ range .Teams }}
                        <option value="{{ .Order }}" {{ if eq (printf "%d" .Order) $.NextDutyTeam }}selected{{ end }}>{{ .Name }}</option>
                        {{ end }}
                    </select>
                </div>

                {{ if .Tasks }}
                <div data-member-search-scope>
                    <h4 class="mb-3 text-xs font-semibold uppercase tracking-wider text-slate-500">Задачи группы</h4>
                    <div class="relative">
                    <i data-lucide="search" class="absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
                    <input type="search" data-member-search placeholder="Поиск по задачам"
                           class="w-full rounded-xl border border-slate-200 bg-slate-50 py-3 pl-11 pr-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">
                    </div>
                    <div class="mt-4 space-y-4">
                        {{ range .Tasks }}
                        <section class="overflow-hidden rounded-xl border border-slate-200" data-member-group>
                            <div class="flex items-center justify-between gap-3 bg-slate-50 px-4 py-3">
                                <h4 class="text-sm font-bold text-slate-900">{{ .Floor }} этаж. {{ .AreaName }}</h4>
                            </div>
                            <div class="divide-y divide-slate-100">
                                {{ range .Tasks }}
                                <label class="flex cursor-pointer items-center gap-3 p-4 hover:bg-blue-50/40 transition-colors" data-member-row data-member-search="{{ .AreaName }} {{ .Title }}">
                                    <input type="checkbox" name="task_ids" value="{{ .ID }}" {{ if .IsActive }}checked{{ end }}
                                           class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                    <span class="min-w-0 flex-1">
                                        <span class="block truncate text-sm font-semibold text-slate-900">{{ .Title }}</span>
                                    </span>
                                </label>
                                {{ end }}
                            </div>
                        </section>
                        {{ end }}
                        <div class="hidden rounded-xl border border-slate-200 p-8 text-center text-sm text-slate-500" data-member-search-empty>Ничего не найдено</div>
                    </div>
                </div>
                {{ else }}
                <div class="px-6 py-12 text-center text-slate-500">
                    <div class="flex flex-col items-center">
                        <i data-lucide="clipboard-x" class="w-12 h-12 text-slate-200 mb-3"></i>
                        <p>Задачи не найдены</p>
                    </div>
                </div>
                {{ end }}
            </div>

            <div class="flex justify-end gap-3 p-6 border-t border-slate-100 bg-slate-50/80">
                <button type="button" onclick="this.closest('[data-modal-backdrop]').remove()"
                        class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-semibold hover:bg-white transition-colors">Отмена</button>
                <button type="submit"
                        class="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 transition-colors">Сохранить</button>
            </div>
        </form>
    </div>
</div>
<script>
    lucide.createIcons();
    setupMemberSearch(document.currentScript.previousElementSibling);
</script>
