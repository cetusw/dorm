<div id="modal" class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="this.closest('#modal').remove()"></div>
    <div class="relative bg-white w-full max-w-2xl max-h-[92vh] rounded-3xl shadow-2xl overflow-hidden">
        <form hx-put="/admin/dormitories/{{ .Dormitory.ID }}/groups/{{ .Group.ID }}/teams/{{ .Team.ID }}" hx-swap="none" data-team-form class="flex max-h-[92vh] flex-col">
            <div class="p-8 overflow-y-auto">
                <h3 class="text-xl font-bold text-slate-900 mb-6">Редактировать команду</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1 col-span-2">
                        <label class="text-xs font-semibold text-slate-500 uppercase">Название</label>
                        <input type="text" name="name" required value="{{ .Team.Name }}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-500 uppercase">Цвет команды</label>
                        <input type="text" name="color" required value="{{ .Team.Color }}" maxlength="7" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-500 uppercase">Порядок</label>
                        <input type="number" name="order" required value="{{ .Team.Order }}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="space-y-1 col-span-2">
                        <label class="text-xs font-semibold text-slate-500 uppercase">Лидер</label>
                        <select name="leader_id" class="admin-select">
                            <option value="">Не назначен</option>
                            {{ range .Residents }}
                            <option value="{{ .ID }}" {{ if eq .ID $.LeaderID }}selected{{ end }}>{{ .FullName }}</option>
                            {{ end }}
                        </select>
                    </div>
                </div>

                <div class="mt-8" data-member-search-scope>
                    <h4 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">Участники команды</h4>
                    <div class="relative mb-3">
                        <i data-lucide="search" class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
                        <input type="search"
                               data-member-search
                               placeholder="Поиск по имени"
                               class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2.5 pl-10 pr-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">
                    </div>
                    <div class="max-h-72 overflow-y-auto border border-slate-200 rounded-xl divide-y divide-slate-100">
                        {{ range .Members }}
                        <label class="p-3 flex items-center justify-between gap-3 hover:bg-slate-50 transition-colors" data-member-row data-member-search="{{ .FullName }}">
                            <div class="text-sm">
                                <div class="font-medium text-slate-800">{{ .FullName }}</div>
                                {{ if .CurrentTeamID }}
                                <div class="text-xs text-slate-500">Сейчас в: {{ .CurrentTeamName }}</div>
                                {{ else }}
                                <div class="text-xs text-slate-400">Без команды</div>
                                {{ end }}
                            </div>
                            <input type="checkbox" name="member_ids" value="{{ .UserID }}" {{ if .IsInCurrentTeam }}checked{{ else if .CurrentTeamID }}data-transfer-member="true"{{ end }} class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                        </label>
                        {{ else }}
                        <div class="p-8 text-center text-sm text-slate-500">В общежитии пока нет жителей</div>
                        {{ end }}
                        <div class="hidden p-8 text-center text-sm text-slate-500" data-member-search-empty>Ничего не найдено</div>
                    </div>
                </div>
            </div>
            <div class="bg-slate-50 px-8 py-6 flex justify-end gap-3 shrink-0">
                <button type="button" onclick="document.getElementById('modal').remove()" class="px-6 py-2.5 rounded-xl font-semibold text-slate-500 hover:bg-slate-200 transition-colors">Отменить</button>
                <button type="submit" class="bg-blue-600 text-white px-8 py-2.5 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all">Сохранить</button>
            </div>
        </form>
    </div>
</div>
