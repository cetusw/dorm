<div id="modal" class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="this.closest('#modal').remove()"></div>
    <div class="relative bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden">
        <form hx-put="/admin/teams/{{ .Team.ID }}" hx-swap="none">
            <div class="p-8">
                <h3 class="text-xl font-bold text-slate-900 mb-6">Редактировать команду</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-500 uppercase">Название</label>
                        <input type="text" name="name" required value="{{ .Team.Name }}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-500 uppercase">Цвет (hex)</label>
                        <input type="text" name="color" required value="{{ .Team.Color }}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-500 uppercase">Порядок</label>
                        <input type="number" name="order" required value="{{ .Team.Order }}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-500 uppercase">Группа</label>
                        <select name="group_id" required class="admin-select">
                            {{ range .Groups }}
                            <option value="{{ .ID }}" {{ if eq .ID $.Team.GroupID }}selected{{ end }}>{{ .Name }}</option>
                            {{ end }}
                        </select>
                    </div>
                </div>

                <div class="mt-8">
                    <h4 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">Участники общежития</h4>
                    <div class="max-h-64 overflow-y-auto border border-slate-200 rounded-xl divide-y divide-slate-100">
                        {{ range .Members }}
                        <div class="p-3 flex items-center justify-between gap-3">
                            <div class="text-sm">
                                <div class="font-medium text-slate-800">{{ .FullName }}</div>
                                {{ if .CurrentTeamID }}
                                <div class="text-xs text-slate-500">Сейчас в: {{ .CurrentTeamName }}</div>
                                {{ else }}
                                <div class="text-xs text-slate-400">Без команды</div>
                                {{ end }}
                            </div>
                            <div class="flex items-center gap-2">
                                {{ if .IsInCurrentTeam }}
                                <button
                                        type="button"
                                        class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-50 text-red-700"
                                        hx-delete="/admin/teams/members/{{ .UserID }}"
                                        hx-swap="none">
                                    Удалить
                                </button>
                                {{ else }}
                                <button
                                        type="button"
                                        class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-50 text-blue-700"
                                        hx-put="/admin/teams/{{ $.Team.ID }}/members/{{ .UserID }}"
                                        hx-confirm="{{ if .CurrentTeamID }}Пользователь уже в другой команде. Переместить?{{ else }}Добавить в команду?{{ end }}"
                                        hx-swap="none">
                                    Добавить
                                </button>
                                {{ end }}
                            </div>
                        </div>
                        {{ end }}
                    </div>
                </div>
            </div>
            <div class="bg-slate-50 px-8 py-6 flex justify-end gap-3">
                <button type="button" onclick="document.getElementById('modal').remove()" class="px-6 py-2.5 rounded-xl font-semibold text-slate-500 hover:bg-slate-200 transition-colors">Отменить</button>
                <button type="submit" class="bg-blue-600 text-white px-8 py-2.5 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all">Сохранить</button>
            </div>
        </form>
    </div>
</div>
