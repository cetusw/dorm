<div id="modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4" data-modal-backdrop>
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[92vh] flex flex-col overflow-hidden border border-slate-200">
        <div class="flex justify-between items-start p-6 border-b border-slate-100">
            <div>
                <h3 class="text-xl font-bold text-slate-900">Создать новую дежурную неделю</h3>
                <p class="mt-1 text-sm text-slate-500">{{ .Dormitory.Name }}</p>
            </div>
            <button type="button" class="text-slate-400 hover:text-slate-600 rounded-lg p-1" onclick="this.closest('[data-modal-backdrop]').remove()">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <form hx-post="/admin/duties/{{ .Dormitory.ID }}" hx-swap="none" class="flex min-h-0 flex-1 flex-col">
            <div class="min-h-0 flex-1 space-y-6 overflow-y-auto p-6">
                <div>
                    <label class="mb-2 block text-sm font-semibold text-slate-700">Период дежурства</label>
                    <div class="grid grid-cols-[1fr_auto_1fr] items-center rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 transition focus-within:border-blue-500 focus-within:bg-white focus-within:ring-4 focus-within:ring-blue-500/10">
                        <input type="text" name="start_date" required placeholder="дд.мм.гггг" pattern="\d{2}\.\d{2}\.\d{4}" inputmode="numeric"
                               class="w-full border-0 bg-transparent px-1 py-1.5 text-sm text-slate-800 outline-none placeholder:text-slate-400">
                        <span class="px-3 text-sm font-semibold text-slate-400">-</span>
                        <input type="text" name="end_date" required placeholder="дд.мм.гггг" pattern="\d{2}\.\d{2}\.\d{4}" inputmode="numeric"
                               class="w-full border-0 bg-transparent px-1 py-1.5 text-sm text-slate-800 outline-none placeholder:text-slate-400">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 p-6 border-t border-slate-100 bg-slate-50/80">
                <button type="button" onclick="this.closest('[data-modal-backdrop]').remove()"
                        class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-semibold hover:bg-white transition-colors">Отмена</button>
                <button type="submit"
                        class="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 transition-colors">Создать</button>
            </div>
        </form>
    </div>
</div>
<script>
    lucide.createIcons();
    setupMemberSearch(document.currentScript.previousElementSibling);
</script>
