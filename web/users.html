<div class="flex justify-between items-end mb-8">
    <div>
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Список жителей</h1>
    </div>

    <button
            hx-get="/admin/users/create"
            hx-target="body"
            hx-swap="beforeend"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition-all shadow-lg shadow-blue-200 flex items-center gap-2 group">
        <i data-lucide="user-plus" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
        Добавить жителя
    </button>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
            <tr class="bg-slate-50/50 border-b border-slate-200">
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Имя</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Локация</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Группа</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Команда</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-right">Действия</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100" id="user-table-body">
            {{ range .Users }}
            <tr class="hover:bg-blue-50/30 transition-colors group" id="user-{{ .ID }}">
                <td class="px-6 py-5">
                    <div class="font-bold text-slate-900 group-hover:text-blue-700 transition-colors">{{ .FullName }}</div>
                </td>
                <td class="px-6 py-5">
                    <div class="flex items-center gap-2 text-sm text-slate-700">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400"></i>
                        {{ .DormitoryName }}
                    </div>
                    <div class="text-xs text-slate-400 mt-0.5 ml-5 text-sm">Комната: <span class="text-slate-600 font-medium">{{ .RoomNumber }}</span></div>
                </td>
                <td class="px-6 py-5">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-200">
                            {{ .GroupName }}
                        </span>
                </td>
                <td class="px-6 py-5">
                    <div class="flex items-center gap-2 text-sm text-slate-600">
                        <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.4)]"></div>
                        <span class="font-medium">{{ .TeamName }}</span>
                    </div>
                </td>
                <td class="px-6 py-5 text-right">
                    <div class="flex justify-end gap-1">
                        <button
                                class="p-2.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all"
                                title="Редактировать"
                                hx-get="/admin/users/{{ .ID }}/edit"
                                hx-target="body"
                                hx-swap="beforeend">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button
                                class="p-2.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all"
                                title="Удалить"
                                hx-delete="/admin/users/{{ .ID }}"
                                hx-confirm="Вы уверены, что хотите удалить жителя {{ .FullName }}?"
                                hx-target="#user-{{ .ID }}"
                                hx-swap="outerHTML">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </td>
            </tr>
            {{ else }}
            <tr>
                <td colspan="5" class="px-6 py-12 text-center text-slate-500">
                    <div class="flex flex-col items-center">
                        <i data-lucide="users" class="w-12 h-12 text-slate-200 mb-3"></i>
                        <p>Жители не найдены</p>
                    </div>
                </td>
            </tr>
            {{ end }}
            </tbody>
        </table>
    </div>
</div>

<script>
    lucide.createIcons();
</script>
