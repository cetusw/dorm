<div class="flex justify-between items-end mb-8">
    <div>
        <nav class="flex text-sm text-slate-500 mb-2" aria-label="Breadcrumb">
            <ol class="flex items-center space-x-2">
                <li><a href="/admin" class="hover:text-blue-600 transition-colors">Панель управления</a></li>
                <li><i data-lucide="chevron-right" class="w-4 h-4"></i></li>
                <li class="text-slate-900 font-medium">Каталог задач</li>
            </ol>
        </nav>
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Каталог задач</h1>
    </div>
    <button hx-get="/admin/tasks/create" hx-target="body" hx-swap="beforeend" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition-all shadow-lg shadow-blue-200 flex items-center gap-2 group">
        <i data-lucide="plus" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
        Создать задачу
    </button>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
            <tr class="bg-slate-50/50 border-b border-slate-200">
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Название</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Зона</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Стоимость</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Частота (дн.)</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-right">Действия</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            {{ range .Tasks }}
            <tr class="hover:bg-blue-50/30 transition-colors">
                <td class="px-6 py-5 font-medium text-slate-900">{{ .Title }}</td>
                <td class="px-6 py-5 text-slate-700">{{ .AreaName }}</td>
                <td class="px-6 py-5 text-slate-700">{{ .Cost }}</td>
                <td class="px-6 py-5 text-slate-700">{{ .Frequency }}</td>
                <td class="px-6 py-5 text-right">
                    <div class="flex justify-end gap-1">
                        <button hx-get="/admin/tasks/{{ .ID }}/edit" hx-target="body" hx-swap="beforeend" class="p-2.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                        <button hx-delete="/admin/tasks/{{ .ID }}" hx-confirm="Удалить задачу {{ .Title }}?" hx-swap="none" class="p-2.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </td>
            </tr>
            {{ else }}
            <tr><td colspan="5" class="px-6 py-12 text-center text-slate-500">Задачи не найдены</td></tr>
            {{ end }}
            </tbody>
        </table>
    </div>
</div>
<script>lucide.createIcons();</script>
