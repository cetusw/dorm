<div class="mb-8 flex items-end justify-between gap-4">
    <div>
        <nav class="mb-3 flex items-center gap-2 text-sm font-medium text-slate-500">
            <a href="/admin/duties" class="hover:text-blue-700">Дежурства</a>
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
            <span class="text-slate-900">{{ .Dormitory.Name }}</span>
        </nav>
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">{{ .Dormitory.Name }}</h1>
    </div>
    <button hx-get="/admin/duties/{{ .Dormitory.ID }}/create" hx-target="body" hx-swap="beforeend"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition-all shadow-lg shadow-blue-200 flex items-center gap-2 group">
        <i data-lucide="calendar-plus" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
        Создать новую дежурную неделю
    </button>
</div>

<div class="mb-5 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <label for="duties-groups-search" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-500">Поиск</label>
    <div class="relative">
        <i data-lucide="search" class="absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
        <input id="duties-groups-search" type="search" data-structure-search placeholder="Название, лидер или spreadsheet_id"
               class="w-full rounded-xl border border-slate-200 bg-slate-50 py-3 pl-11 pr-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">
    </div>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden" data-structure-table>
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
            <tr class="bg-slate-50/50 border-b border-slate-200">
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Название</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Лидер</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Таблица</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-right">Действия</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            {{ range .Groups }}
            <tr class="hover:bg-blue-50/30 transition-colors group cursor-pointer"
                data-structure-row
                data-search="{{ .Name }} {{ .LeaderName }} {{ .SpreadsheetID }}"
                onclick="window.location='/admin/dormitories/{{ $.Dormitory.ID }}/groups/{{ .ID }}/duties'">
                <td class="px-6 py-5 font-bold text-slate-900 group-hover:text-blue-700 transition-colors">{{ .Name }}</td>
                <td class="px-6 py-5 text-sm text-slate-700">{{ .LeaderName }}</td>
                <td class="px-6 py-5 text-sm text-slate-700">
                    {{ if .SpreadsheetURL }}
                    <a href="{{ .SpreadsheetURL }}" target="_blank" rel="noreferrer" class="inline-flex items-center gap-2 font-medium text-blue-700 hover:text-blue-800" onclick="event.stopPropagation()">
                        <i data-lucide="external-link" class="w-4 h-4"></i>
                        Открыть таблицу
                    </a>
                    {{ else }}
                    <span class="text-slate-400">Не указана</span>
                    {{ end }}
                </td>
                <td class="px-6 py-5 text-right">
                    <a href="/admin/dormitories/{{ $.Dormitory.ID }}/groups/{{ .ID }}/duties" class="inline-flex p-2.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all" title="Дежурства" onclick="event.stopPropagation()">
                        <i data-lucide="calendar-check" class="w-4 h-4"></i>
                    </a>
                </td>
            </tr>
            {{ else }}
            <tr>
                <td colspan="4" class="px-6 py-12 text-center text-slate-500">
                    <div class="flex flex-col items-center">
                        <i data-lucide="folder-tree" class="w-12 h-12 text-slate-200 mb-3"></i>
                        <p>В этом общежитии пока нет групп</p>
                    </div>
                </td>
            </tr>
            {{ end }}
            <tr class="hidden" data-filter-empty>
                <td colspan="4" class="px-6 py-12 text-center text-slate-500">
                    <div class="flex flex-col items-center">
                        <i data-lucide="search-x" class="w-12 h-12 text-slate-200 mb-3"></i>
                        <p>Ничего не найдено</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>lucide.createIcons();</script>
