<div class="flex justify-between items-end mb-8">
    <div>
        <nav class="mb-3 flex flex-wrap items-center gap-2 text-sm font-medium text-slate-500">
            <a href="/admin/duties" class="hover:text-blue-700">Дежурства</a>
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
            <a href="/admin/duties/{{ .Dormitory.ID }}/groups" class="hover:text-blue-700">{{ .Dormitory.Name }}</a>
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
            <span class="text-slate-900">{{ .Group.Name }}</span>
        </nav>
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Дежурства {{ .Group.Name }}</h1>
    </div>

    <button hx-get="/admin/dormitories/{{ .Dormitory.ID }}/groups/{{ .Group.ID }}/duties/future" hx-target="body" hx-swap="beforeend"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition-all shadow-lg shadow-blue-200 flex items-center gap-2 group">
        <i data-lucide="list-checks" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
        Настройки дежурства группы
    </button>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
            <tr class="bg-slate-50/50 border-b border-slate-200">
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Дата начала</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Дата конца</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Команда</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            {{ range .Duties }}
            <tr class="hover:bg-blue-50/30 transition-colors cursor-pointer"
                onclick="window.location='/admin/dormitories/{{ $.Dormitory.ID }}/groups/{{ $.Group.ID }}/duties/{{ .ID }}'">
                <td class="px-6 py-5 text-sm font-medium text-slate-900">{{ .StartDate.Format "02.01.2006" }}</td>
                <td class="px-6 py-5 text-sm text-slate-700">{{ .EndDate.Format "02.01.2006" }}</td>
                <td class="px-6 py-5 text-sm text-slate-700">{{ .TeamName }}</td>
            </tr>
            {{ else }}
            <tr>
                <td colspan="3" class="px-6 py-12 text-center text-slate-500">
                    <div class="flex flex-col items-center">
                        <i data-lucide="calendar-x" class="w-12 h-12 text-slate-200 mb-3"></i>
                        <p>Дежурства не найдены</p>
                    </div>
                </td>
            </tr>
            {{ end }}
            </tbody>
        </table>
    </div>
</div>

<script>lucide.createIcons();</script>
