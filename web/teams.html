<div class="flex justify-between items-end mb-8">
    <div>
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Команды</h1>
    </div>
    <button
            hx-get="/admin/teams/create"
            hx-target="body"
            hx-swap="beforeend"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition-all shadow-lg shadow-blue-200 flex items-center gap-2 group">
        <i data-lucide="plus" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
        Создать команду
    </button>
</div>

<div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6">
    <label class="text-xs font-semibold text-slate-500 uppercase">Общежитие</label>
    <select
            class="w-full mt-2 px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none"
            hx-get="/admin/teams"
            hx-trigger="change"
            hx-target="body"
            hx-push-url="true"
            name="dormitory_id">
        {{ range .Dormitories }}
        <option value="{{ .ID }}" {{ if eq $.SelectedDormID .ID }}selected{{ end }}>{{ .Name }}</option>
        {{ end }}
    </select>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
            <tr class="bg-slate-50/50 border-b border-slate-200">
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Команда</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Группа</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Участники</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-right">Действия</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            {{ range .Teams }}
            <tr id="team-{{ .ID }}" class="hover:bg-blue-50/30 transition-colors">
                <td class="px-6 py-5">
                    <div class="font-semibold text-slate-900 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full" style="background: #{{ .Color }};"></span>
                        {{ .Name }}
                    </div>
                    <div class="text-xs text-slate-400 mt-1">Порядок: {{ .Order }}</div>
                </td>
                <td class="px-6 py-5 text-sm text-slate-700">{{ .GroupName }}</td>
                <td class="px-6 py-5 text-sm text-slate-700">{{ .MembersCount }}</td>
                <td class="px-6 py-5 text-right">
                    <div class="flex justify-end gap-1">
                        <button
                                class="p-2.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all"
                                title="Редактировать"
                                hx-get="/admin/teams/{{ .ID }}/edit"
                                hx-target="body"
                                hx-swap="beforeend">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button
                                class="p-2.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all"
                                title="Удалить"
                                hx-delete="/admin/teams/{{ .ID }}"
                                hx-confirm="Удалить команду {{ .Name }}?"
                                hx-swap="none">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </td>
            </tr>
            {{ else }}
            <tr>
                <td colspan="4" class="px-6 py-12 text-center text-slate-500">Команды не найдены</td>
            </tr>
            {{ end }}
            </tbody>
        </table>
    </div>
</div>

<script>lucide.createIcons();</script>
