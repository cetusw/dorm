<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F8F7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="dorm" />
    <title>dorm</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f6f8f7;
      }

      body {
        min-height: 100vh;
      }

      #app-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f8f7;
        z-index: 9999;
      }

      #app-preloader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #dde4e2;
        border-top-color: #166534;
        border-radius: 50%;
        box-sizing: border-box;
        animation: app-preloader-spin 0.8s linear infinite;
      }

      @keyframes app-preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-preloader" aria-hidden="true">
      <div id="app-preloader-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
